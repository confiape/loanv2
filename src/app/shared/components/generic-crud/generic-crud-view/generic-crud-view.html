<div
  class="space-y-4"
  [attr.data-testid]="testIds().wrapper"
>
  <!-- Body -->
  <div
    class="grid grid-cols-1 md:grid-cols-2 gap-4"
    [attr.data-testid]="testIds().body"
  >
    @for (field of fields(); track field.key) {
      <div class="space-y-1">
        <dt class="text-sm font-medium text-text-secondary">
          {{ field.label }}
        </dt>
        <dd class="text-base text-text-primary break-words">
          {{ getFieldValue(field) }}
        </dd>
      </div>
    }
  </div>

  <!-- Footer -->
  <div
    class="flex justify-end gap-3 pt-4 border-t border-border"
    [attr.data-testid]="testIds().footer"
  >
    <app-button
      [variant]="'outline'"
      [tone]="'neutral'"
      [dataTestId]="testIds().btnDelete"
      (buttonClick)="onDeleteClick()"
    >
      Delete
    </app-button>
    <app-button
      [variant]="'solid'"
      [tone]="'primary'"
      [dataTestId]="testIds().btnEdit"
      (buttonClick)="onEditClick()"
    >
      Edit
    </app-button>
  </div>
</div>
